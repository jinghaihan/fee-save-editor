name: complete-validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check formatting and static analysis
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal assets)"
          go vet ./...
      - name: Verify save engine, GUI and languages
        run: go test -race ./...
      - name: Verify CI and release guards
        run: |
          python scripts/test_ci.py
          python scripts/test_release_script.py
      - name: Build CLI
        run: go build -o build/FeeEditor.Cli ./cmd/fee-cli
      - name: Complete CLI regression
        run: python scripts/test_cli.py --cli build/FeeEditor.Cli
