name: build

on:
  push:
    branches: [main, refactor/mygo]
    paths-ignore:
      - VERSION
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml

  packages:
    uses: ./.github/workflows/platforms.yml
    with:
      artifact-prefix: fee-build
